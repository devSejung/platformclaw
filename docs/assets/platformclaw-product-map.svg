<svg width="1440" height="560" viewBox="0 0 1440 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>PlatformClaw architecture map</title>
  <desc>PlatformClaw connects enterprise identity and shared services to the OpenClaw runtime and governed execution targets.</desc>
  <defs>
    <linearGradient id="mapBg" x1="82" y1="36" x2="1350" y2="528" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1020"/>
      <stop offset="1" stop-color="#09131A"/>
    </linearGradient>
    <linearGradient id="brandLine" x1="160" y1="0" x2="1180" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/>
      <stop offset="0.52" stop-color="#6577FF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="mapShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="1440" height="560" rx="28" fill="url(#mapBg)"/>
  <text x="72" y="72" fill="#F8FAFC" font-size="28" font-weight="750" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">How PlatformClaw fits together</text>
  <text x="72" y="103" fill="#7D899B" font-size="16" font-weight="500" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">Enterprise control around a generic OpenClaw agent runtime.</text>

