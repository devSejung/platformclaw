  <text x="878" y="323" fill="#AAB5C7" font-size="14" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">Generic agent infrastructure stays upstream.</text>

