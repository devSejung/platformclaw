  <circle cx="454" cy="428" r="5" fill="#22D3EE"/>
  <text x="469" y="434" fill="#C7D0DE" font-size="13" font-weight="650" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">Wiki Hub · Skill Hub · MCP</text>

  <text x="72" y="495" fill="#667085" font-size="13" font-weight="650" letter-spacing="1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">PLATFORMCLAW OWNS ENTERPRISE POLICY. OPENCLAW OWNS THE GENERIC AGENT RUNTIME.</text>
