name: PlatformClaw CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate:
    name: PlatformClaw CI
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
          install-deps: "false"

      - name: Plan validation scope
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: >-
          node scripts/platformclaw-ci-plan.mjs
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --github-output "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.plan.outputs.needs_dependencies == 'true'
        run: pnpm install --frozen-lockfile

      - name: Check PlatformClaw docs inventory
        if: steps.plan.outputs.needs_docs_checks == 'true'
        run: node scripts/docs-list.js

      - name: Audit PlatformClaw documentation links
        if: steps.plan.outputs.needs_docs_checks == 'true'
        run: node scripts/docs-link-audit.mjs

      - name: Run repository policy guards
        if: steps.plan.outputs.needs_policy_guards == 'true'
        run: |
          pnpm check:no-conflict-markers
          pnpm check:changelog-attributions
          pnpm lint:extensions:no-guarded-wildcard-reexports
          pnpm lint:extensions:no-plugin-sdk-wildcard-reexports
          pnpm dup:check:coverage
          pnpm deps:pins:check
          pnpm deps:patches:check

      - name: Check max-lines suppression ratchet
        if: steps.plan.outputs.needs_package_checks == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="${HEAD_SHA}^"
          fi
          pnpm check:max-lines-ratchet --base "$BASE_SHA"

      - name: Validate changed PlatformClaw surfaces
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: >-
          node scripts/platformclaw-check.mjs
          --changed
          --overlay-only
          --base "$BASE_SHA"
          --head "$HEAD_SHA"

      - name: Validate PlatformClaw deployment files
        if: steps.plan.outputs.needs_deployment_checks == 'true'
        env:
          PLATFORMCLAW_COMPANY_APT_SOURCES: /tmp/platformclaw-empty-apt-sources
          PLATFORMCLAW_CREDENTIAL_BROKER_VOLUME_NAME: platformclaw-ci-credential-broker-1000-1000
          PLATFORMCLAW_DEPLOY_HOST_ROOT: /tmp/platformclaw-deploy
          PLATFORMCLAW_DEPLOY_ROOT: /var/lib/platformclaw
          PLATFORMCLAW_EMPLOYEE_AUTH_CA_FILE: /tmp/platformclaw-employee-auth-ca.pem
          PLATFORMCLAW_EMPLOYEE_AUTH_ADSSO_URL: https://auth.example.test/adsso
          PLATFORMCLAW_EMPLOYEE_AUTH_MOCK_PORT: "18080"
          PLATFORMCLAW_EMPLOYEE_AUTH_ADSSO_SECRET_SECRET_FILE: /tmp/platformclaw-empty-secret
          PLATFORMCLAW_EMPLOYEE_AUTH_LOGIN_URL: https://auth.example.test/login
          PLATFORMCLAW_EXECUTION_SERVICE_TOKEN_SECRET_FILE: /tmp/platformclaw-empty-secret
          PLATFORMCLAW_GATEWAY_SERVICE_IDENTITY_SECRET_FILE: /tmp/platformclaw-empty-secret
          PLATFORMCLAW_GATEWAY_TOKEN_SECRET_FILE: /tmp/platformclaw-empty-secret
          PLATFORMCLAW_INITIAL_ADMIN_IDS_SECRET_FILE: /tmp/platformclaw-empty-secret
          PLATFORMCLAW_KNOX_CDEP_URL: https://cdep.example.test/api/v1/platformclaw/knox/outbound/send
          PLATFORMCLAW_KNOX_SERVICE_TOKEN_SECRET_FILE: /tmp/platformclaw-empty-secret
          PLATFORMCLAW_KNOX_WEBHOOK_SECRET_SECRET_FILE: /tmp/platformclaw-empty-secret
          PLATFORMCLAW_SSH_CREDENTIAL_MASTER_KEY_SECRET_FILE: /tmp/platformclaw-empty-secret
          PLATFORMCLAW_PUBLIC_ORIGIN: https://platformclaw.example.test
          PLATFORMCLAW_REPO_ROOT: ${{ github.workspace }}
          PLATFORMCLAW_RUNTIME_GID: "1000"
          PLATFORMCLAW_RUNTIME_UID: "1000"
          PLATFORMCLAW_SANDBOX_DOCKER_RUNTIME_DIR: /tmp/platformclaw-sandbox-docker
          PLATFORMCLAW_SMOKE_SANDBOX_IMAGE_TAR: /tmp/platformclaw-sandbox.tar
          PLATFORMCLAW_SMOKE_WORKSPACE_DIR: /tmp/platformclaw-workspaces
        run: |
          touch "$PLATFORMCLAW_COMPANY_APT_SOURCES"
          touch "$PLATFORMCLAW_EMPLOYEE_AUTH_CA_FILE"
          touch "$PLATFORMCLAW_EMPLOYEE_AUTH_ADSSO_SECRET_SECRET_FILE"
          touch "$PLATFORMCLAW_GATEWAY_TOKEN_SECRET_FILE"
          node --check scripts/platformclaw-build.mjs
          bash -n scripts/e2e/platformclaw-runtime-docker.sh
          docker compose -f docker/platformclaw-jammy/compose.yaml config --quiet
          docker compose \
            -f docker/platformclaw-runtime/compose.yaml \
            -f docker/platformclaw-runtime/compose.smoke.yaml \
            config --quiet

      - name: Validate workflow contracts
        if: steps.plan.outputs.needs_workflow_checks == 'true'
        run: node scripts/check-workflows.mjs
