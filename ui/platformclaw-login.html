<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#181715" media="(prefers-color-scheme: dark)" />
    <meta name="robots" content="noindex,nofollow" />
    <base href="/platformclaw/" />
    <title>PlatformClaw 로그인</title>
    <link rel="icon" type="image/svg+xml" href="/src/platformclaw/platformclaw-pixel.svg" />
    <link rel="stylesheet" href="/src/platformclaw/login.css" />
  </head>
  <body>
    <main class="login-page" data-platformclaw-login>
      <section class="login-hero" data-login-hero aria-hidden="true"></section>

      <section class="login-card" aria-labelledby="login-title">
        <div class="login-mascot" data-login-mascot aria-hidden="true"></div>
        <div class="login-card__heading">
          <h2 id="login-title">PlatformClaw</h2>
          <p>로그인 후 내 Agent, Workspace, 실행 대상을 한곳에서 확인하세요.</p>
        </div>
        <ul class="login-context" aria-label="PlatformClaw 작업 경계">
          <li>개인 Agent</li>
          <li>격리 Workspace</li>
          <li>정책 기반 VM · Sandbox</li>
        </ul>
        <form data-login-form novalidate>
          <label>
            <span>계정</span>
            <input
              name="identifier"
              type="text"
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
              placeholder="AD ID"
              required
              disabled
            />
          </label>
          <label>
            <span>비밀번호</span>
            <input
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="비밀번호"
              required
              disabled
            />
          </label>
          <p class="login-error" data-login-error role="alert" hidden></p>
          <button type="submit" disabled>세션 확인 중</button>
        </form>
        <p class="login-status" data-login-status aria-live="polite">
          기존 로그인 상태를 확인하고 있습니다.
        </p>
        <p class="login-privacy">
          비밀번호는 브라우저에 저장되지 않으며, 역할과 실행 권한은 서버 정책으로 결정됩니다.
        </p>
      </section>
    </main>
    <script type="module" src="/src/platformclaw/login.ts"></script>
  </body>
</html>
