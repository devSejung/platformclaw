<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>PlatformClaw workspace illustration</title>
    <style>
      :host {
        display: block;
        min-width: 0;
        color: var(--login-ink);
        font-family: inherit;
      }
      * {
        box-sizing: border-box;
      }
      .hero {
        position: relative;
        display: flex;
        min-height: 590px;
        padding: 32px 26px 24px;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid var(--login-hairline);
        border-radius: 24px;
        background: var(--login-surface);
      }
      .eyebrow {
        display: flex;
        margin: 0 36px 16px 0;
        align-items: center;
        gap: 9px;
        color: var(--login-primary);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.15em;
      }
      .eyebrow::before {
        width: 6px;
        height: 6px;
        border-radius: 2px;
        background: currentColor;
        content: "";
      }
      .motion-toggle {
        position: absolute;
        inset: 25px 19px auto auto;
        display: grid;
        width: 32px;
        height: 32px;
        padding: 8px;
        place-items: center;
        border: 0;
        border-radius: var(--radius-md);
        color: var(--login-muted);
        background: transparent;
        cursor: pointer;
      }
      .motion-toggle:focus-visible {
        outline: 2px solid var(--login-primary);
        outline-offset: 2px;
      }
      .motion-toggle svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
      }
      .motion-toggle [data-play],
      .motion-toggle[aria-pressed="true"] [data-pause] {
        display: none;
      }
      .motion-toggle[aria-pressed="true"] [data-play] {
        display: block;
      }
      h1 {
        margin: 0;
        font-size: clamp(32px, 3.4vw, 40px);
        font-weight: 650;
        letter-spacing: -0.065em;
        line-height: 1.25;
      }
      h1 .headline-accent {
        color: var(--login-primary);
      }
      .intro {
        margin: 14px 0 0;
        color: var(--login-muted);
        font-size: 12px;
        line-height: 1.7;
        letter-spacing: -0.02em;
      }
      .scene {
        position: relative;
        display: grid;
        margin: 8px -25px 0;
        flex: 1;
        align-items: center;
      }
      .scene::before {
        position: absolute;
        inset: 15% 8% 8%;
        border-radius: 50%;
        background-image: radial-gradient(var(--login-hairline) 1px, transparent 1px);
        background-size: 16px 16px;
        mask-image: radial-gradient(ellipse, #000 30%, transparent 70%);
        content: "";
      }
      .workspace {
        position: relative;
        display: block;
        width: 100%;
        height: 290px;
        overflow: visible;
        color: var(--login-body);
        font: inherit;
      }
      .paper {
        fill: var(--login-canvas);
        stroke: var(--login-hairline);
      }
      .soft {
        fill: var(--login-surface-strong);
      }
      .ink {
        fill: var(--login-ink);
      }
      .muted {
        fill: var(--login-muted);
      }
      .accent {
        fill: var(--login-primary);
      }
      .accent-soft {
        fill: color-mix(in srgb, var(--login-primary) 11%, var(--login-canvas));
      }
      .line {
        fill: none;
        stroke: var(--login-primary);
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .hairline {
        fill: none;
        stroke: var(--login-hairline);
      }
      .label {
        font-size: 13px;
        font-weight: 650;
        letter-spacing: -0.02em;
      }
      .small {
        font-size: 11px;
        font-weight: 500;
      }
      .mono {
        font-size: 10px;
        font-family: ui-monospace, monospace;
        letter-spacing: 0.06em;
      }
      .title {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.04em;
      }
      .connector {
        stroke: var(--login-primary);
        stroke-opacity: 0.45;
      }
      .trace {
        stroke-dasharray: 1;
        stroke-dashoffset: 0;
        animation: draw 800ms var(--ease-out) both;
        animation-delay: var(--delay, 0ms);
      }
      .arrive {
        transform-box: fill-box;
        transform-origin: center;
        animation: arrive 650ms var(--ease-out) both;
        animation-delay: var(--delay, 0ms);
      }
      .source-one {
        --delay: 100ms;
      }
      .source-two {
        --delay: 300ms;
      }
      .source-three {
        --delay: 500ms;
      }
      .incoming {
        --delay: 650ms;
      }
      .work-card {
        --delay: 1000ms;
      }
      .task-one {
        --delay: 1400ms;
      }
      .task-two {
        --delay: 1700ms;
      }
      .task-three {
        --delay: 2000ms;
      }
      .outgoing {
        --delay: 2300ms;
      }
      .result {
        --delay: 2700ms;
      }
      .result-detail {
        --delay: 3100ms;
      }
      .complete {
        --delay: 3500ms;
      }
      .flow-packet {
        fill: var(--login-primary);
        stroke: var(--login-canvas);
        stroke-width: 1px;
        stroke-opacity: 1;
        opacity: 0;
        pointer-events: none;
      }
      :host([data-motion-ready]) .arrive,
      :host([data-motion-ready]) .trace {
        animation: none;
      }
      /* Cards and connectors float in the same coordinate system, preserving their
         endpoints. Different idle periods avoid a shared, visible reset point. */
      :host([data-motion-ready]) .workspace {
        animation: workspace-float 8s var(--ease-in-out) infinite;
      }
      :host([data-motion-ready]) .workspace-glow {
        animation: workspace-glow 11s var(--ease-in-out) infinite;
      }
      :host([data-motion-paused]) .arrive,
      :host([data-motion-paused]) .trace,
      :host([data-motion-paused]) .workspace,
      :host([data-motion-paused]) .workspace-glow,
      :host([data-ambient-paused]) .workspace,
      :host([data-ambient-paused]) .workspace-glow {
        animation-play-state: paused;
      }
      .steps {
        display: flex;
        margin: 14px 0 0;
        padding-top: 20px;
        align-items: center;
        justify-content: space-between;
        border-top: 1px solid var(--login-hairline);
        color: var(--login-muted);
        font-size: 11px;
        letter-spacing: -0.02em;
      }
      .steps span {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .steps b {
        color: var(--login-primary);
        font:
          10px ui-monospace,
          monospace;
      }
      .steps i {
        width: 20px;
        height: 1px;
        background: var(--login-hairline);
      }
      @keyframes arrive {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes draw {
        from {
          stroke-dashoffset: 1;
        }
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes workspace-float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-2px);
        }
      }
      @keyframes workspace-glow {
        0%,
        100% {
          opacity: 0.06;
        }
        50% {
          opacity: 0.13;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .arrive,
        .trace,
        :host([data-motion-ready]) .workspace,
        :host([data-motion-ready]) .workspace-glow {
          animation: none;
        }
        .motion-toggle {
          display: none;
        }
      }
      @media (max-width: 1100px) {
        .hero {
          padding: 30px 24px 24px;
        }
        .scene {
          margin-inline: -22px;
        }
        .intro {
          font-size: 12px;
        }
      }
    </style>
  </head>
  <body>
    <section class="hero">
      <p class="eyebrow">YOUR WORK, CONNECTED</p>
      <button
        class="motion-toggle"
        type="button"
        data-motion-toggle
        data-login-copy-aria-label="pauseAnimation"
        aria-label="Pause animation"
        aria-pressed="false"
      >
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path data-pause d="M4 3h3v10H4zM9 3h3v10H9z" />
          <path data-play d="m5 3 8 5-8 5z" />
        </svg>
      </button>
      <h1>
        <span data-login-copy="heroHeadlineLead">Small requests.</span><br />
        <span class="headline-accent" data-login-copy="heroHeadlineAccent"
          >Work, accomplished.</span
        >
      </h1>
      <p class="intro">
        <span data-login-copy="heroDescriptionFirst"
          >Connect context. Put the right tools to work.</span
        ><br />
        <span data-login-copy="heroDescriptionSecond"
          >Your workspace brings it all together, through to the result.</span
        >
      </p>
      <div class="scene">
        <svg class="workspace" viewBox="0 0 600 350" aria-hidden="true">
          <!-- Authored paths stay attached to their endpoints during reveal. -->
          <g class="line connector">
            <path
              class="trace incoming"
              pathLength="1"
              d="M138 87H157Q173 87 173 103V154Q173 170 190 170H208"
            />
            <path class="trace incoming" pathLength="1" d="M116 179H208" />
            <path
              class="trace incoming"
              pathLength="1"
              d="M145 277H157Q173 277 173 261V216Q173 200 190 200H208"
            />
            <path
              class="trace outgoing"
              pathLength="1"
              d="M408 185H429Q445 185 445 169V124Q445 108 462 108H481"
            />
          </g>
          <g transform="translate(26 48)">
            <g class="arrive source-one">
              <rect
                class="soft"
                x="7"
                y="-6"
                width="112"
                height="78"
                rx="12"
                transform="rotate(-7 63 33)"
              />
              <rect class="paper" width="112" height="78" rx="12" />
              <rect class="accent-soft" x="12" y="12" width="28" height="28" rx="8" />
              <path class="line" d="M21 19h8l4 4v10H21z M29 19v5h4 M24 28h6" />
              <text class="label ink" x="12" y="60" data-login-copy="heroDocuments">
                Docs &amp; notes
              </text>
              <path class="hairline" d="M51 20h43 M51 27h34 M51 34h39" />
            </g>
          </g>
          <g transform="translate(4 146)">
            <g class="arrive source-two">
              <rect class="paper" width="112" height="66" rx="12" />
              <rect class="accent-soft" x="12" y="12" width="28" height="28" rx="8" />
              <path class="line" d="m22 22-4 4 4 4 M30 22l4 4-4 4 M27 20l-3 12" />
              <text class="label ink" x="49" y="27" data-login-copy="heroTools">Tools</text>
              <text class="small muted" x="12" y="54" data-login-copy="heroToolsCaption">
                When needed
              </text>
            </g>
          </g>
          <g transform="translate(33 244)">
            <g class="arrive source-three">
              <rect class="paper" width="112" height="66" rx="12" />
              <rect class="accent-soft" x="12" y="12" width="28" height="28" rx="8" />
              <path class="line" d="M21 20h12v10h-6l-4 4v-4h-2z M24 24h6" />
              <text class="label ink" x="49" y="28" data-login-copy="heroConversation">Chat</text>
              <text class="small muted" x="12" y="54" data-login-copy="heroConversationCaption">
                Shared context
              </text>
            </g>
          </g>
          <g transform="translate(208 70)">
            <g class="arrive work-card">
              <rect
                class="workspace-glow"
                x="-5"
                y="8"
                width="210"
                height="238"
                rx="19"
                fill="var(--login-primary)"
                opacity="0.06"
              />
              <rect class="paper" width="200" height="238" rx="16" />
              <rect class="accent-soft" x="1" y="1" width="198" height="54" rx="15" />
              <path class="hairline" d="M1 55h198" />
              <rect class="accent" x="16" y="16" width="23" height="23" rx="7" />
              <path
                d="m22 25 4 4 6-7"
                fill="none"
                stroke="var(--login-canvas)"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <text class="label ink" x="49" y="32">PlatformClaw</text>
              <circle class="accent" cx="179" cy="28" r="3" />
              <text class="mono muted" x="16" y="81">MY WORKSPACE</text>
              <text class="title ink" x="16" y="108" data-login-copy="heroWorkspaceTitle">
                Your AI teammate
              </text>
              <g class="arrive task-one">
                <circle class="accent-soft" cx="24" cy="138" r="8" />
                <path class="line" d="m21 138 2 2 4-5" />
                <text class="small ink" x="41" y="142" data-login-copy="heroConnectInformation">
                  Connect knowledge
                </text>
              </g>
              <g class="arrive task-two">
                <circle class="accent-soft" cx="24" cy="168" r="8" />
                <path class="line" d="m21 168 2 2 4-5" />
                <text class="small ink" x="41" y="172" data-login-copy="heroExecuteTasks">
                  Get work done
                </text>
              </g>
              <g class="arrive task-three">
                <circle class="accent-soft" cx="24" cy="198" r="8" />
                <path class="line" d="m21 198 2 2 4-5" />
                <text class="small ink" x="41" y="202" data-login-copy="heroOrganizeResults">
                  Bring results together
                </text>
              </g>
              <rect class="soft" x="16" y="220" width="168" height="3" rx="1.5" />
            </g>
          </g>
          <g transform="translate(468 61)">
            <g class="arrive result">
              <rect class="soft" x="8" y="9" width="118" height="174" rx="12" />
              <rect class="paper" width="118" height="174" rx="12" />
              <rect class="accent-soft" x="12" y="12" width="94" height="25" rx="6" />
              <text class="small accent" x="24" y="29" data-login-copy="heroResultsCaption">
                Results
              </text>
              <text class="label ink" x="14" y="62" data-login-copy="heroWorkSummary">
                Work summary
              </text>
              <path class="hairline" d="M14 74h88 M14 82h70" />
              <g class="arrive result-detail">
                <rect class="soft" x="14" y="99" width="90" height="47" rx="6" />
                <rect class="accent" x="25" y="124" width="12" height="12" rx="2" opacity="0.4" />
                <rect class="accent" x="44" y="115" width="12" height="21" rx="2" opacity="0.65" />
                <rect class="accent" x="63" y="107" width="12" height="29" rx="2" />
                <path class="line" d="m83 117 4 4 8-9" />
              </g>
              <path class="hairline" d="M14 158h61" />
            </g>
          </g>
          <g transform="translate(435 260)">
            <g class="arrive complete">
              <rect class="accent-soft" width="142" height="36" rx="18" />
              <circle class="accent" cx="19" cy="18" r="9" />
              <path
                d="m15 18 3 3 5-6"
                fill="none"
                stroke="var(--login-canvas)"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <text class="small accent" x="35" y="22" data-login-copy="heroNextTask">
                Ready for more.
              </text>
            </g>
          </g>
        </svg>
      </div>
      <div class="steps">
        <span><b>01</b><span data-login-copy="heroStepConnect">Connect</span></span
        ><i></i> <span><b>02</b><span data-login-copy="heroStepExecute">Execute</span></span
        ><i></i>
        <span><b>03</b><span data-login-copy="heroStepReview">Review</span></span>
      </div>
    </section>
  </body>
</html>
