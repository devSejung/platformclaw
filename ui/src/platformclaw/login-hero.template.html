<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>PlatformClaw workspace illustration</title>
    <style>
      :host {
        display: block;
        min-width: 0;
        color: var(--login-ink);
        font-family: inherit;
      }
      * {
        box-sizing: border-box;
      }
      .hero {
        position: relative;
        display: flex;
        min-height: 590px;
        padding: 32px 26px 24px;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid var(--login-hairline);
        border-radius: 24px;
        background: var(--login-surface);
      }
      .eyebrow {
        display: flex;
        margin: 0 0 16px;
        align-items: center;
        gap: 9px;
        color: var(--login-primary);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.15em;
      }
      .eyebrow::before {
        width: 6px;
        height: 6px;
        border-radius: 2px;
        background: currentColor;
        content: "";
      }
      h1 {
        margin: 0;
        font-size: clamp(32px, 3.4vw, 40px);
        font-weight: 650;
        letter-spacing: -0.065em;
        line-height: 1.25;
      }
      h1 span {
        color: var(--login-primary);
      }
      .intro {
        margin: 14px 0 0;
        color: var(--login-muted);
        font-size: 12px;
        line-height: 1.7;
        letter-spacing: -0.02em;
      }
      .scene {
        position: relative;
        display: grid;
        margin: 8px -25px 0;
        flex: 1;
        align-items: center;
      }
      .scene::before {
        position: absolute;
        inset: 15% 8% 8%;
        border-radius: 50%;
        background-image: radial-gradient(var(--login-hairline) 1px, transparent 1px);
        background-size: 16px 16px;
        mask-image: radial-gradient(ellipse, #000 30%, transparent 70%);
        content: "";
      }
      .workspace {
        position: relative;
        display: block;
        width: 100%;
        height: 290px;
        overflow: visible;
        color: var(--login-body);
        font: inherit;
      }
      .paper {
        fill: var(--login-canvas);
        stroke: var(--login-hairline);
      }
      .soft {
        fill: var(--login-surface-strong);
      }
      .ink {
        fill: var(--login-ink);
      }
      .muted {
        fill: var(--login-muted);
      }
      .accent {
        fill: var(--login-primary);
      }
      .accent-soft {
        fill: color-mix(in srgb, var(--login-primary) 11%, var(--login-canvas));
      }
      .line {
        fill: none;
        stroke: var(--login-primary);
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .hairline {
        fill: none;
        stroke: var(--login-hairline);
      }
      .label {
        font-size: 13px;
        font-weight: 650;
        letter-spacing: -0.02em;
      }
      .small {
        font-size: 11px;
        font-weight: 500;
      }
      .mono {
        font-size: 10px;
        font-family: ui-monospace, monospace;
        letter-spacing: 0.06em;
      }
      .title {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.04em;
      }
      .connector {
        stroke: var(--login-primary);
        stroke-opacity: 0.45;
      }
      .trace {
        stroke-dasharray: 1;
        stroke-dashoffset: 0;
        animation: draw 800ms cubic-bezier(0.22, 1, 0.36, 1) both;
        animation-delay: var(--delay, 0ms);
      }
      .arrive {
        transform-box: fill-box;
        transform-origin: center;
        animation: arrive 650ms cubic-bezier(0.22, 1, 0.36, 1) both;
        animation-delay: var(--delay, 0ms);
      }
      .source-one {
        --delay: 100ms;
      }
      .source-two {
        --delay: 300ms;
      }
      .source-three {
        --delay: 500ms;
      }
      .incoming {
        --delay: 650ms;
      }
      .work-card {
        --delay: 1000ms;
      }
      .task-one {
        --delay: 1400ms;
      }
      .task-two {
        --delay: 1700ms;
      }
      .task-three {
        --delay: 2000ms;
      }
      .outgoing {
        --delay: 2300ms;
      }
      .result {
        --delay: 2700ms;
      }
      .result-detail {
        --delay: 3100ms;
      }
      .complete {
        --delay: 3500ms;
      }
      .steps {
        display: flex;
        margin: 14px 0 0;
        padding-top: 20px;
        align-items: center;
        justify-content: space-between;
        border-top: 1px solid var(--login-hairline);
        color: var(--login-muted);
        font-size: 11px;
        letter-spacing: -0.02em;
      }
      .steps span {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .steps b {
        color: var(--login-primary);
        font:
          10px ui-monospace,
          monospace;
      }
      .steps i {
        width: 20px;
        height: 1px;
        background: var(--login-hairline);
      }
      /* One illustration settles after 4.15s. No overlapping text scenes or
         idle loop competes with the sign-in form. */
      @keyframes arrive {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes draw {
        from {
          stroke-dashoffset: 1;
        }
        to {
          stroke-dashoffset: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .arrive,
        .trace {
          animation: none;
        }
      }
      @media (max-width: 1100px) {
        .hero {
          padding: 30px 24px 24px;
        }
        .scene {
          margin-inline: -22px;
        }
        .intro {
          font-size: 12px;
        }
      }
    </style>
  </head>
  <body>
    <section class="hero">
      <p class="eyebrow">YOUR WORK, CONNECTED</p>
      <h1>작은 요청이<br /><span>완성된 업무로.</span></h1>
      <p class="intro">
        맥락을 연결하고, 필요한 도구를 실행하고.<br />결과까지 한곳에서 이어지는 나의 워크스페이스.
      </p>
      <div class="scene">
        <svg class="workspace" viewBox="0 0 600 350" aria-hidden="true">
          <!-- Authored paths stay attached to their endpoints during reveal. -->
          <g class="line connector">
            <path
              class="trace incoming"
              pathLength="1"
              d="M138 87H157Q173 87 173 103V154Q173 170 190 170H208"
            />
            <path class="trace incoming" pathLength="1" d="M116 179H208" />
            <path
              class="trace incoming"
              pathLength="1"
              d="M145 277H157Q173 277 173 261V216Q173 200 190 200H208"
            />
            <path
              class="trace outgoing"
              pathLength="1"
              d="M408 185H429Q445 185 445 169V124Q445 108 462 108H481"
            />
          </g>
          <g transform="translate(26 48)">
            <g class="arrive source-one">
              <rect
                class="soft"
                x="7"
                y="-6"
                width="112"
                height="78"
                rx="12"
                transform="rotate(-7 63 33)"
              />
              <rect class="paper" width="112" height="78" rx="12" />
              <rect class="accent-soft" x="12" y="12" width="28" height="28" rx="8" />
              <path class="line" d="M21 19h8l4 4v10H21z M29 19v5h4 M24 28h6" />
              <text class="label ink" x="12" y="60">문서와 지식</text>
              <path class="hairline" d="M51 20h43 M51 27h34 M51 34h39" />
            </g>
          </g>
          <g transform="translate(4 146)">
            <g class="arrive source-two">
              <rect class="paper" width="112" height="66" rx="12" />
              <rect class="accent-soft" x="12" y="12" width="28" height="28" rx="8" />
              <path class="line" d="m22 22-4 4 4 4 M30 22l4 4-4 4 M27 20l-3 12" />
              <text class="label ink" x="49" y="27">도구</text>
              <text class="small muted" x="12" y="54">필요한 순간에</text>
            </g>
          </g>
          <g transform="translate(33 244)">
            <g class="arrive source-three">
              <rect class="paper" width="112" height="66" rx="12" />
              <rect class="accent-soft" x="12" y="12" width="28" height="28" rx="8" />
              <path class="line" d="M21 20h12v10h-6l-4 4v-4h-2z M24 24h6" />
              <text class="label ink" x="49" y="28">대화</text>
              <text class="small muted" x="12" y="54">이어지는 맥락</text>
            </g>
          </g>
          <g transform="translate(208 70)">
            <g class="arrive work-card">
              <rect
                x="-5"
                y="8"
                width="210"
                height="238"
                rx="19"
                fill="var(--login-primary)"
                opacity="0.06"
              />
              <rect class="paper" width="200" height="238" rx="16" />
              <rect class="accent-soft" x="1" y="1" width="198" height="54" rx="15" />
              <path class="hairline" d="M1 55h198" />
              <rect class="accent" x="16" y="16" width="23" height="23" rx="7" />
              <path
                d="m22 25 4 4 6-7"
                fill="none"
                stroke="var(--login-canvas)"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <text class="label ink" x="49" y="32">PlatformClaw</text>
              <circle class="accent" cx="179" cy="28" r="3" />
              <text class="mono muted" x="16" y="81">MY WORKSPACE</text>
              <text class="title ink" x="16" y="108">함께 일하는 AI</text>
              <g class="arrive task-one">
                <circle class="accent-soft" cx="24" cy="138" r="8" />
                <path class="line" d="m21 138 2 2 4-5" />
                <text class="small ink" x="41" y="142">흩어진 정보 연결</text>
              </g>
              <g class="arrive task-two">
                <circle class="accent-soft" cx="24" cy="168" r="8" />
                <path class="line" d="m21 168 2 2 4-5" />
                <text class="small ink" x="41" y="172">필요한 작업 실행</text>
              </g>
              <g class="arrive task-three">
                <circle class="accent-soft" cx="24" cy="198" r="8" />
                <path class="line" d="m21 198 2 2 4-5" />
                <text class="small ink" x="41" y="202">결과를 하나로 정리</text>
              </g>
              <rect class="soft" x="16" y="220" width="168" height="3" rx="1.5" />
            </g>
          </g>
          <g transform="translate(468 61)">
            <g class="arrive result">
              <rect class="soft" x="8" y="9" width="118" height="174" rx="12" />
              <rect class="paper" width="118" height="174" rx="12" />
              <rect class="accent-soft" x="12" y="12" width="94" height="25" rx="6" />
              <text class="small accent" x="24" y="29">결과가 모이는 곳</text>
              <text class="label ink" x="14" y="62">업무 요약</text>
              <path class="hairline" d="M14 74h88 M14 82h70" />
              <g class="arrive result-detail">
                <rect class="soft" x="14" y="99" width="90" height="47" rx="6" />
                <rect class="accent" x="25" y="124" width="12" height="12" rx="2" opacity="0.4" />
                <rect class="accent" x="44" y="115" width="12" height="21" rx="2" opacity="0.65" />
                <rect class="accent" x="63" y="107" width="12" height="29" rx="2" />
                <path class="line" d="m83 117 4 4 8-9" />
              </g>
              <path class="hairline" d="M14 158h61" />
            </g>
          </g>
          <g transform="translate(435 260)">
            <g class="arrive complete">
              <rect class="accent-soft" width="142" height="36" rx="18" />
              <circle class="accent" cx="19" cy="18" r="9" />
              <path
                d="m15 18 3 3 5-6"
                fill="none"
                stroke="var(--login-canvas)"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <text class="small accent" x="35" y="22">다음 업무를 가볍게.</text>
            </g>
          </g>
        </svg>
      </div>
      <div class="steps">
        <span><b>01</b> 맥락을 연결</span><i></i> <span><b>02</b> 업무를 실행</span><i></i>
        <span><b>03</b> 결과를 확인</span>
      </div>
    </section>
  </body>
</html>
