name: platformclaw

services:
  platformclaw-state-init:
    image: ${PLATFORMCLAW_IMAGE:-platformclaw:local}
    pull_policy: never
    user: "0:0"
    environment:
      PLATFORMCLAW_RUNTIME_UID: ${PLATFORMCLAW_RUNTIME_UID:?run platformclaw-compose with a service user}
      PLATFORMCLAW_RUNTIME_GID: ${PLATFORMCLAW_RUNTIME_GID:?run platformclaw-compose with a service user}
    network_mode: none
    volumes:
      - ${PLATFORMCLAW_DEPLOY_HOST_ROOT:?run platformclaw-compose with a service user}/data/gateway-home/.openclaw:/state/gateway
      - ${PLATFORMCLAW_DEPLOY_HOST_ROOT:?run platformclaw-compose with a service user}/data/control:/state/control
      - ./init-state:/opt/platformclaw/init-state:ro
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    entrypoint: ["bash", "/opt/platformclaw/init-state"]
    restart: "no"

  openclaw-gateway:
    image: ${PLATFORMCLAW_IMAGE:-platformclaw:local}
    pull_policy: never
    user: "${PLATFORMCLAW_RUNTIME_UID:?run platformclaw-compose with a service user}:${PLATFORMCLAW_RUNTIME_GID:?run platformclaw-compose with a service user}"
    depends_on:
      platformclaw-state-init:
        condition: service_completed_successfully
    environment:
      DOCKER_HOST: unix:///run/platformclaw-sandbox-docker/docker.sock
      HOME: ${PLATFORMCLAW_DEPLOY_ROOT:?run platformclaw-compose with a service user}/data/gateway-home
      OPENCLAW_STATE_DIR: ${PLATFORMCLAW_DEPLOY_ROOT:?run platformclaw-compose with a service user}/data/gateway-home/.openclaw
      OPENCLAW_CONFIG_PATH: ${PLATFORMCLAW_DEPLOY_ROOT:?run platformclaw-compose with a service user}/data/gateway-home/.openclaw/openclaw.json
      PLATFORMCLAW_CREDENTIAL_BROKER_ADDRESS: /run/platformclaw-credential-broker/credential.sock
      PLATFORMCLAW_EXECUTION_SERVICE_TOKEN_FILE: /run/secrets/platformclaw_execution_service_token
      PLATFORMCLAW_KNOX_CDEP_URL: ${PLATFORMCLAW_KNOX_CDEP_URL:?set PLATFORMCLAW_KNOX_CDEP_URL}
      PLATFORMCLAW_KNOX_CONTROL_PLANE_URL: http://control.platformclaw.local:19002/platformclaw/internal/knox/route
      PLATFORMCLAW_KNOX_WEBHOOK_SECRET_FILE: /run/secrets/platformclaw_knox_webhook_secret
      PLATFORMCLAW_KNOX_SERVICE_TOKEN_FILE: /run/secrets/platformclaw_knox_service_token
      PLATFORMCLAW_SANDBOX_IMAGE: ${PLATFORMCLAW_SANDBOX_IMAGE:-platformclaw-sandbox:local}
      WEB_FETCH_RELAY_URL: ${WEB_FETCH_RELAY_URL:-}
      WEB_SEARCH_RELAY_URL: ${WEB_SEARCH_RELAY_URL:-}
      NODE_EXTRA_CA_CERTS: /etc/platformclaw/certs/employee-auth-ca.pem
      TZ: ${PLATFORMCLAW_TZ:-Asia/Seoul}
    volumes:
      - ${PLATFORMCLAW_DEPLOY_HOST_ROOT:?run platformclaw-compose with a service user}/data/gateway-home/.openclaw:${PLATFORMCLAW_DEPLOY_ROOT:?run platformclaw-compose with a service user}/data/gateway-home/.openclaw
      - ${PLATFORMCLAW_DEPLOY_HOST_ROOT:?run platformclaw-compose with a service user}/data/workspaces:${PLATFORMCLAW_DEPLOY_ROOT:?run platformclaw-compose with a service user}/data/workspaces
      - ${PLATFORMCLAW_SANDBOX_DOCKER_RUNTIME_DIR:?set PLATFORMCLAW_SANDBOX_DOCKER_RUNTIME_DIR}:/run/platformclaw-sandbox-docker:ro
      - platformclaw-credential-broker:/run/platformclaw-credential-broker:ro
      - ${PLATFORMCLAW_EMPLOYEE_AUTH_CA_FILE:?set PLATFORMCLAW_EMPLOYEE_AUTH_CA_FILE}:/etc/platformclaw/certs/employee-auth-ca.pem:ro
    tmpfs:
      - ${PLATFORMCLAW_DEPLOY_ROOT:?run platformclaw-compose with a service user}/data/gateway-home:uid=${PLATFORMCLAW_RUNTIME_UID:?run platformclaw-compose with a service user},gid=${PLATFORMCLAW_RUNTIME_GID:?run platformclaw-compose with a service user},mode=0700
    secrets:
      - platformclaw_gateway_token
      - platformclaw_execution_service_token
      - platformclaw_knox_webhook_secret
      - platformclaw_knox_service_token
    networks:
      platformclaw-gateway-backplane:
        aliases: [gateway.platformclaw.local]
      platformclaw-gateway-egress: {}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped
    command: ["platformclaw-gateway"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  platformclaw-control:
    image: ${PLATFORMCLAW_IMAGE:-platformclaw:local}
    pull_policy: never
    user: "${PLATFORMCLAW_RUNTIME_UID:?run platformclaw-compose with a service user}:${PLATFORMCLAW_RUNTIME_GID:?run platformclaw-compose with a service user}"
    depends_on:
      openclaw-gateway:
        condition: service_healthy
    environment:
      HOME: ${PLATFORMCLAW_DEPLOY_ROOT:?run platformclaw-compose with a service user}/data/control/home
      PLATFORMCLAW_PUBLIC_ORIGIN: ${PLATFORMCLAW_PUBLIC_ORIGIN:?set PLATFORMCLAW_PUBLIC_ORIGIN}
      PLATFORMCLAW_LISTEN_HOST: 0.0.0.0
      PLATFORMCLAW_LISTEN_PORT: "19002"
      PLATFORMCLAW_DATABASE_PATH: ${PLATFORMCLAW_DEPLOY_ROOT:?run platformclaw-compose with a service user}/data/control/platformclaw-control.sqlite
      PLATFORMCLAW_CONTROL_UI_ROOT: /app/ui/dist
      PLATFORMCLAW_VOC_URL: ${PLATFORMCLAW_VOC_URL:-}
      PLATFORMCLAW_PERSONAL_WORKSPACE_ROOT: ${PLATFORMCLAW_DEPLOY_ROOT:?run platformclaw-compose with a service user}/data/workspaces
      PLATFORMCLAW_INITIAL_ADMIN_ACCOUNT_IDS_FILE: /run/secrets/platformclaw_initial_admin_ids
      PLATFORMCLAW_GATEWAY_URL: ws://gateway.platformclaw.local:18789
      PLATFORMCLAW_GATEWAY_TOKEN_FILE: /run/secrets/platformclaw_gateway_token
      PLATFORMCLAW_GATEWAY_SERVICE_IDENTITY_FILE: /run/secrets/platformclaw_gateway_service_identity
      PLATFORMCLAW_SSH_CREDENTIAL_MASTER_KEY_FILE: /run/secrets/platformclaw_ssh_credential_master_key
      PLATFORMCLAW_CREDENTIAL_BROKER_ADDRESS: /run/platformclaw-credential-broker/credential.sock
      PLATFORMCLAW_EXECUTION_SERVICE_TOKEN_FILE: /run/secrets/platformclaw_execution_service_token
      PLATFORMCLAW_KNOX_SERVICE_TOKEN_FILE: /run/secrets/platformclaw_knox_service_token
      PLATFORMCLAW_EMPLOYEE_AUTH_LOGIN_URL: ${PLATFORMCLAW_EMPLOYEE_AUTH_LOGIN_URL:?set PLATFORMCLAW_EMPLOYEE_AUTH_LOGIN_URL}
      NODE_EXTRA_CA_CERTS: /etc/platformclaw/certs/employee-auth-ca.pem
      TZ: ${PLATFORMCLAW_TZ:-Asia/Seoul}
    volumes:
      - ${PLATFORMCLAW_DEPLOY_HOST_ROOT:?run platformclaw-compose with a service user}/data/control:${PLATFORMCLAW_DEPLOY_ROOT:?run platformclaw-compose with a service user}/data/control
      - ${PLATFORMCLAW_DEPLOY_HOST_ROOT:?run platformclaw-compose with a service user}/data/workspaces:${PLATFORMCLAW_DEPLOY_ROOT:?run platformclaw-compose with a service user}/data/workspaces
      - platformclaw-credential-broker:/run/platformclaw-credential-broker
      - ${PLATFORMCLAW_EMPLOYEE_AUTH_CA_FILE:?set PLATFORMCLAW_EMPLOYEE_AUTH_CA_FILE}:/etc/platformclaw/certs/employee-auth-ca.pem:ro
    secrets:
      - platformclaw_gateway_token
      - platformclaw_gateway_service_identity
      - platformclaw_execution_service_token
      - platformclaw_initial_admin_ids
      - platformclaw_knox_service_token
      - platformclaw_ssh_credential_master_key
    networks:
      platformclaw-gateway-backplane:
        aliases: [control.platformclaw.local]
      platformclaw-control-egress: {}
    ports:
      - "0.0.0.0:${PLATFORMCLAW_PUBLIC_PORT:-19002}:19002"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped
    command: ["platformclaw-control"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:19002/platformclaw/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  platformclaw-workspace-migration:
    image: ${PLATFORMCLAW_IMAGE:-platformclaw:local}
    pull_policy: never
    profiles: [migration]
    user: "0:0"
    environment:
      PLATFORMCLAW_RUNTIME_UID: ${PLATFORMCLAW_RUNTIME_UID:?run platformclaw-compose with a service user}
      PLATFORMCLAW_RUNTIME_GID: ${PLATFORMCLAW_RUNTIME_GID:?run platformclaw-compose with a service user}
    network_mode: none
    volumes:
      - platformclaw-workspaces:/source:ro
      - ${PLATFORMCLAW_DEPLOY_HOST_ROOT:?run platformclaw-compose with a service user}/data/workspaces:/target
    entrypoint: ["platformclaw-migrate-workspaces"]
    restart: "no"

  platformclaw-workspace-owner-migration:
    image: ${PLATFORMCLAW_IMAGE:-platformclaw:local}
    pull_policy: never
    profiles: [owner-migration]
    user: "0:0"
    environment:
      PLATFORMCLAW_RUNTIME_UID: ${PLATFORMCLAW_RUNTIME_UID:?run platformclaw-compose with a service user}
      PLATFORMCLAW_RUNTIME_GID: ${PLATFORMCLAW_RUNTIME_GID:?run platformclaw-compose with a service user}
      PLATFORMCLAW_PREVIOUS_RUNTIME_UID: ${PLATFORMCLAW_PREVIOUS_RUNTIME_UID:-}
      PLATFORMCLAW_PREVIOUS_RUNTIME_GID: ${PLATFORMCLAW_PREVIOUS_RUNTIME_GID:-}
    network_mode: none
    volumes:
      - ${PLATFORMCLAW_DEPLOY_HOST_ROOT:?run platformclaw-compose with a service user}/data/workspaces:/workspace
      - ./migrate-workspace-owner:/opt/platformclaw/migrate-workspace-owner:ro
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH]
    security_opt: [no-new-privileges:true]
    entrypoint: ["bash", "/opt/platformclaw/migrate-workspace-owner"]
    restart: "no"

volumes:
  platformclaw-workspaces:
  platformclaw-credential-broker:
    name: ${PLATFORMCLAW_CREDENTIAL_BROKER_VOLUME_NAME:?run platformclaw-compose with a service user}
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=${PLATFORMCLAW_RUNTIME_UID:?run platformclaw-compose with a service user},gid=${PLATFORMCLAW_RUNTIME_GID:?run platformclaw-compose with a service user},mode=0700

networks:
  platformclaw-gateway-backplane:
    internal: true
  platformclaw-gateway-egress:
  platformclaw-control-egress:

secrets:
  platformclaw_gateway_token:
    file: ${PLATFORMCLAW_GATEWAY_TOKEN_SECRET_FILE:?set PLATFORMCLAW_GATEWAY_TOKEN_SECRET_FILE}
  platformclaw_gateway_service_identity:
    file: ${PLATFORMCLAW_GATEWAY_SERVICE_IDENTITY_SECRET_FILE:?set PLATFORMCLAW_GATEWAY_SERVICE_IDENTITY_SECRET_FILE}
  platformclaw_execution_service_token:
    file: ${PLATFORMCLAW_EXECUTION_SERVICE_TOKEN_SECRET_FILE:?set PLATFORMCLAW_EXECUTION_SERVICE_TOKEN_SECRET_FILE}
  platformclaw_initial_admin_ids:
    file: ${PLATFORMCLAW_INITIAL_ADMIN_IDS_SECRET_FILE:?set PLATFORMCLAW_INITIAL_ADMIN_IDS_SECRET_FILE}
  platformclaw_knox_webhook_secret:
    file: ${PLATFORMCLAW_KNOX_WEBHOOK_SECRET_SECRET_FILE:?set PLATFORMCLAW_KNOX_WEBHOOK_SECRET_SECRET_FILE}
  platformclaw_knox_service_token:
    file: ${PLATFORMCLAW_KNOX_SERVICE_TOKEN_SECRET_FILE:?set PLATFORMCLAW_KNOX_SERVICE_TOKEN_SECRET_FILE}
  platformclaw_ssh_credential_master_key:
    file: ${PLATFORMCLAW_SSH_CREDENTIAL_MASTER_KEY_SECRET_FILE:?set PLATFORMCLAW_SSH_CREDENTIAL_MASTER_KEY_SECRET_FILE}
