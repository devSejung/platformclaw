name: platformclaw

services:
  platformclaw-state-init:
    image: ${PLATFORMCLAW_IMAGE:-platformclaw:local}
    pull_policy: never
    user: "0:0"
    environment:
      PLATFORMCLAW_RUNTIME_UID: ${PLATFORMCLAW_RUNTIME_UID:?run platformclaw-compose with a service user}
      PLATFORMCLAW_RUNTIME_GID: ${PLATFORMCLAW_RUNTIME_GID:?run platformclaw-compose with a service user}
    network_mode: none
    volumes:
      - ${PLATFORMCLAW_DEPLOY_HOST_ROOT:?run platformclaw-compose with a service user}/data/gateway-home/.openclaw:/state/gateway
      - ${PLATFORMCLAW_DEPLOY_HOST_ROOT:?run platformclaw-compose with a service user}/data/control:/state/control
      - ./init-state:/opt/platformclaw/init-state:ro
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    entrypoint: ["bash", "/opt/platformclaw/init-state"]
    restart: "no"

  openclaw-gateway:
    image: ${PLATFORMCLAW_IMAGE:-platformclaw:local}
    pull_policy: never
    user: "${PLATFORMCLAW_RUNTIME_UID:?run platformclaw-compose with a service user}:${PLATFORMCLAW_RUNTIME_GID:?run platformclaw-compose with a service user}"
    depends_on:
      platformclaw-state-init:
        condition: service_completed_successfully
    environment:
      DOCKER_HOST: unix:///run/platformclaw-sandbox-docker/docker.sock
      HOME: ${PLATFORMCLAW_DEPLOY_ROOT:?run platformclaw-compose with a service user}/data/gateway-home
      OPENCLAW_STATE_DIR: ${PLATFORMCLAW_DEPLOY_ROOT:?run platformclaw-compose with a service user}/data/gateway-home/.openclaw
      OPENCLAW_CONFIG_PATH: ${PLATFORMCLAW_DEPLOY_ROOT:?run platformclaw-compose with a service user}/data/gateway-home/.openclaw/openclaw.json
      PLATFORMCLAW_CREDENTIAL_BROKER_ADDRESS: /run/platformclaw-credential-broker/credential.sock
      PLATFORMCLAW_EXECUTION_SERVICE_TOKEN_FILE: /run/secrets/platformclaw_execution_service_token
      PLATFORMCLAW_KNOX_CDEP_URL: ${PLATFORMCLAW_KNOX_CDEP_URL:?set PLATFORMCLAW_KNOX_CDEP_URL}
      PLATFORMCLAW_KNOX_CONTROL_PLANE_URL: http://control.platformclaw.local:19002/platformclaw/internal/knox/route
      PLATFORMCLAW_KNOX_WEBHOOK_SECRET_FILE: /run/secrets/platformclaw_knox_webhook_secret
      PLATFORMCLAW_KNOX_SERVICE_TOKEN_FILE: /run/secrets/platformclaw_knox_service_token
      PLATFORMCLAW_SANDBOX_IMAGE: ${PLATFORMCLAW_SANDBOX_IMAGE:-platformclaw-sandbox:local}
      WEB_FETCH_RELAY_URL: ${WEB_FETCH_RELAY_URL:-}
      WEB_SEARCH_RELAY_URL: ${WEB_SEARCH_RELAY_URL:-}
      NODE_EXTRA_CA_CERTS: /etc/platformclaw/certs/employee-auth-ca.pem
      TZ: ${PLATFORMCLAW_TZ:-Asia/Seoul}
    volumes:
      - ${PLATFORMCLAW_DEPLOY_HOST_ROOT:?run platformclaw-compose with a service user}/data/gateway-home/.openclaw:${PLATFORMCLAW_DEPLOY_ROOT:?run platformclaw-compose with a service user}/data/gateway-home/.openclaw
      - ${PLATFORMCLAW_DEPLOY_HOST_ROOT:?run platformclaw-compose with a service user}/data/workspaces:${PLATFORMCLAW_DEPLOY_ROOT:?run platformclaw-compose with a service user}/data/workspaces
      - ${PLATFORMCLAW_SANDBOX_DOCKER_RUNTIME_DIR:?set PLATFORMCLAW_SANDBOX_DOCKER_RUNTIME_DIR}:/run/platformclaw-sandbox-docker:ro
      - platformclaw-credential-broker:/run/platformclaw-credential-broker:ro
      - ${PLATFORMCLAW_EMPLOYEE_AUTH_CA_FILE:?set PLATFORMCLAW_EMPLOYEE_AUTH_CA_FILE}:/etc/platformclaw/certs/employee-auth-ca.pem:ro
    tmpfs:
      - ${PLATFORMCLAW_DEPLOY_ROOT:?run platformclaw-compose with a service user}/data/gateway-home:uid=${PLATFORMCLAW_RUNTIME_UID:?run platformclaw-compose with a service user},gid=${PLATFORMCLAW_RUNTIME_GID:?run platformclaw-compose with a service user},mode=0700
    secrets:
      - platformclaw_gateway_token
      - platformclaw_execution_service_token
      - platformclaw_knox_webhook_secret
      - platformclaw_knox_service_token
    networks:
      platformclaw-gateway-backplane:
        aliases: [gateway.platformclaw.local]
      platformclaw-gateway-egress: {}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped
    command: ["platformclaw-gateway"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  platformclaw-control:
    image: ${PLATFORMCLAW_IMAGE:-platformclaw:local}
    pull_policy: never
    user: "${PLATFORMCLAW_RUNTIME_UID:?run platformclaw-compose with a service user}:${PLATFORMCLAW_RUNTIME_GID:?run platformclaw-compose with a service user}"
    depends_on:
      openclaw-gateway:
        condition: service_healthy
    environment:
      HOME: ${PLATFORMCLAW_DEPLOY_ROOT:?run platformclaw-compose with a service user}/data/control/home
      PLATFORMCLAW_PUBLIC_ORIGIN: ${PLATFORMCLAW_PUBLIC_ORIGIN:?set PLATFORMCLAW_PUBLIC_ORIGIN}
      PLATFORMCLAW_LISTEN_HOST: 0.0.0.0
      PLATFORMCLAW_LISTEN_PORT: "19002"
      PLATFORMCLAW_DATABASE_PATH: ${PLATFORMCLAW_DEPLOY_ROOT:?run platformclaw-compose with a service user}/data/control/platformclaw-control.sqlite
      PLATFORMCLAW_CONTROL_UI_ROOT: /app/ui/dist
      PLATFORMCLAW_VOC_URL: ${PLATFORMCLAW_VOC_URL:-}
      PLATFORMCLAW_PERSONAL_WORKSPACE_ROOT: ${PLATFORMCLAW_DEPLOY_ROOT:?run platformclaw-compose with a service user}/data/workspaces
      PLATFORMCLAW_INITIAL_ADMIN_ACCOUNT_IDS_FILE: /run/secrets/platformclaw_initial_admin_ids
      PLATFORMCLAW_GATEWAY_URL: ws://gateway.platformclaw.local:18789
      PLATFORMCLAW_GATEWAY_TOKEN_FILE: /run/secrets/platformclaw_gateway_token
      PLATFORMCLAW_GATEWAY_SERVICE_IDENTITY_FILE: /run/secrets/platformclaw_gateway_service_identity
      PLATFORMCLAW_SSH_CREDENTIAL_MASTER_KEY_FILE: /run/secrets/platformclaw_ssh_credential_master_key
      PLATFORMCLAW_CREDENTIAL_BROKER_ADDRESS: /run/platformclaw-credential-broker/credential.sock
      PLATFORMCLAW_EXECUTION_SERVICE_TOKEN_FILE: /run/secrets/platformclaw_execution_service_token
      PLATFORMCLAW_KNOX_SERVICE_TOKEN_FILE: /run/secrets/platformclaw_knox_service_token
      PLATFORMCLAW_SKILL_HUB_URL: ${PLATFORMCLAW_SKILL_HUB_URL:-}
      PLATFORMCLAW_SKILL_HUB_TOKEN_FILE: ${PLATFORMCLAW_SKILL_HUB_TOKEN_FILE:-}
      PLATFORMCLAW_SKILL_HUB_BOOTSTRAP_PASSWORD_FILE: ${PLATFORMCLAW_SKILL_HUB_BOOTSTRAP_PASSWORD_FILE:-}
      # Retired value is passed through only so the loader can emit its migration error.
      PLATFORMCLAW_SKILL_HUB_PRIMARY_ADMIN_ID: ${PLATFORMCLAW_SKILL_HUB_PRIMARY_ADMIN_ID:-}
      PLATFORMCLAW_SKILL_HUB_NAMESPACES: ${PLATFORMCLAW_SKILL_HUB_NAMESPACES:-}
      PLATFORMCLAW_SKILL_HUB_MAX_PACKAGE_BYTES: ${PLATFORMCLAW_SKILL_HUB_MAX_PACKAGE_BYTES:-524288000}
      PLATFORMCLAW_EMPLOYEE_AUTH_LOGIN_URL: ${PLATFORMCLAW_EMPLOYEE_AUTH_LOGIN_URL:?set PLATFORMCLAW_EMPLOYEE_AUTH_LOGIN_URL}
      PLATFORMCLAW_EMPLOYEE_AUTH_ADSSO_URL: ${PLATFORMCLAW_EMPLOYEE_AUTH_ADSSO_URL:?set PLATFORMCLAW_EMPLOYEE_AUTH_ADSSO_URL}
      PLATFORMCLAW_EMPLOYEE_AUTH_ADSSO_SECRET_FILE: /run/secrets/platformclaw_employee_auth_adsso_secret
      NODE_EXTRA_CA_CERTS: /etc/platformclaw/certs/employee-auth-ca.pem
      TZ: ${PLATFORMCLAW_TZ:-Asia/Seoul}
    volumes:
      - ${PLATFORMCLAW_DEPLOY_HOST_ROOT:?run platformclaw-compose with a service user}/data/control:${PLATFORMCLAW_DEPLOY_ROOT:?run platformclaw-compose with a service user}/data/control
      - ${PLATFORMCLAW_DEPLOY_HOST_ROOT:?run platformclaw-compose with a service user}/data/workspaces:${PLATFORMCLAW_DEPLOY_ROOT:?run platformclaw-compose with a service user}/data/workspaces
      - platformclaw-credential-broker:/run/platformclaw-credential-broker
      - ${PLATFORMCLAW_EMPLOYEE_AUTH_CA_FILE:?set PLATFORMCLAW_EMPLOYEE_AUTH_CA_FILE}:/etc/platformclaw/certs/employee-auth-ca.pem:ro
    secrets:
      - platformclaw_gateway_token
      - platformclaw_gateway_service_identity
      - platformclaw_execution_service_token
      - platformclaw_initial_admin_ids
      - platformclaw_knox_service_token
      - platformclaw_ssh_credential_master_key
      - platformclaw_skill_hub_token
      - platformclaw_skill_hub_bootstrap_password
      - platformclaw_employee_auth_adsso_secret
    networks:
      platformclaw-gateway-backplane:
        aliases: [control.platformclaw.local]
      platformclaw-control-egress: {}
      platformclaw-skillhub: {}
    ports:
      - "0.0.0.0:${PLATFORMCLAW_PUBLIC_PORT:-19002}:19002"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped
    command: ["platformclaw-control"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:19002/platformclaw/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  skillhub-postgres-init:
    profiles: [skillhub]
    image: ${PLATFORMCLAW_SKILL_HUB_POSTGRES_IMAGE:-platformclaw-skillhub-postgres:44c4ee9810ef}
    pull_policy: never
    user: "0:0"
    network_mode: none
    volumes:
      - ${PLATFORMCLAW_DEPLOY_HOST_ROOT:?run platformclaw-compose with a service user}/data/skillhub/postgres:/data
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    entrypoint: ["sh", "-ceu", "chown -R postgres:postgres /data"]
    restart: "no"

  skillhub-postgres:
    profiles: [skillhub]
    image: ${PLATFORMCLAW_SKILL_HUB_POSTGRES_IMAGE:-platformclaw-skillhub-postgres:44c4ee9810ef}
    pull_policy: never
    depends_on:
      skillhub-postgres-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: skillhub
      POSTGRES_USER: skillhub
      POSTGRES_PASSWORD_FILE: /run/secrets/platformclaw_skill_hub_postgres_password
    volumes:
      - ${PLATFORMCLAW_DEPLOY_HOST_ROOT:?run platformclaw-compose with a service user}/data/skillhub/postgres:/var/lib/postgresql/data
    secrets: [platformclaw_skill_hub_postgres_password]
    networks: [platformclaw-skillhub]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillhub -d skillhub"]
      interval: 5s
      timeout: 5s
      retries: 20

  skillhub-redis-init:
    profiles: [skillhub]
    image: ${PLATFORMCLAW_SKILL_HUB_REDIS_IMAGE:-platformclaw-skillhub-redis:e7723ff73d96}
    pull_policy: never
    user: "0:0"
    network_mode: none
    volumes:
      - ${PLATFORMCLAW_DEPLOY_HOST_ROOT:?run platformclaw-compose with a service user}/data/skillhub/redis:/data
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    entrypoint: ["sh", "-ceu", "chown -R redis:redis /data"]
    restart: "no"

  skillhub-redis:
    profiles: [skillhub]
    image: ${PLATFORMCLAW_SKILL_HUB_REDIS_IMAGE:-platformclaw-skillhub-redis:e7723ff73d96}
    pull_policy: never
    depends_on:
      skillhub-redis-init:
        condition: service_completed_successfully
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${PLATFORMCLAW_DEPLOY_HOST_ROOT:?run platformclaw-compose with a service user}/data/skillhub/redis:/data
    networks: [platformclaw-skillhub]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  skillhub-storage-init:
    profiles: [skillhub]
    image: ${PLATFORMCLAW_SKILL_HUB_SERVER_IMAGE:-platformclaw-skillhub-server:6e133c006e49}
    pull_policy: never
    user: "0:0"
    network_mode: none
    volumes:
      - ${PLATFORMCLAW_DEPLOY_HOST_ROOT:?run platformclaw-compose with a service user}/data/skillhub/storage:/data
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    environment:
      PLATFORMCLAW_RUNTIME_UID: ${PLATFORMCLAW_RUNTIME_UID:?run platformclaw-compose with a service user}
      PLATFORMCLAW_RUNTIME_GID: ${PLATFORMCLAW_RUNTIME_GID:?run platformclaw-compose with a service user}
    entrypoint:
      ["sh", "-ceu", 'chown -R "$$PLATFORMCLAW_RUNTIME_UID:$$PLATFORMCLAW_RUNTIME_GID" /data']
    restart: "no"

  skillhub-scanner:
    profiles: [skillhub]
    image: ${PLATFORMCLAW_SKILL_HUB_SCANNER_IMAGE:-platformclaw-skillhub-scanner:6e133c006e49}
    pull_policy: never
    networks: [platformclaw-skillhub]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  skillhub-server:
    profiles: [skillhub]
    image: ${PLATFORMCLAW_SKILL_HUB_SERVER_IMAGE:-platformclaw-skillhub-server:6e133c006e49}
    pull_policy: never
    depends_on:
      skillhub-postgres:
        condition: service_healthy
      skillhub-redis:
        condition: service_healthy
      skillhub-scanner:
        condition: service_healthy
      skillhub-storage-init:
        condition: service_completed_successfully
    environment:
      HOME: /tmp
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://skillhub-postgres:5432/skillhub
      SPRING_DATASOURCE_USERNAME: skillhub
      SPRING_DATA_REDIS_HOST: skillhub-redis
      SPRING_DATA_REDIS_PORT: "6379"
      SKILLHUB_STORAGE_PROVIDER: local
      STORAGE_BASE_PATH: /var/lib/skillhub/storage
      SKILLHUB_SECURITY_SCANNER_ENABLED: "true"
      SKILLHUB_SECURITY_SCANNER_URL: http://skillhub-scanner:8000
      SKILLHUB_SECURITY_SCANNER_MODE: upload
      SKILLHUB_SECURITY_SCANNER_READ_TIMEOUT: "600000"
      SKILLHUB_SCANNER_USE_LLM: "false"
      SKILLHUB_SCANNER_USE_VIRUSTOTAL: "false"
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 500MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 500MB
      SKILLHUB_PUBLISH_MAX_FILE_COUNT: "100"
      SKILLHUB_PUBLISH_MAX_SINGLE_FILE_SIZE: "262144000"
      SKILLHUB_PUBLISH_MAX_PACKAGE_SIZE: "1073741824"
      SKILLHUB_AUTH_DIRECT_ENABLED: "true"
      BOOTSTRAP_ADMIN_ENABLED: "true"
      BOOTSTRAP_ADMIN_USER_ID: platformclaw-bootstrap
      BOOTSTRAP_ADMIN_USERNAME: platformclaw-bootstrap
      BOOTSTRAP_ADMIN_DISPLAY_NAME: PlatformClaw Bootstrap
      BOOTSTRAP_ADMIN_EMAIL: platformclaw-bootstrap@localhost
      SKILLHUB_SERVICE_VERSION: v0.2.16
      SKILLHUB_SERVICE_ENVIRONMENT: platformclaw
    secrets:
      - platformclaw_skill_hub_postgres_password
      - platformclaw_skill_hub_cookie_secret
      - platformclaw_skill_hub_bootstrap_password
    volumes:
      - ${PLATFORMCLAW_DEPLOY_HOST_ROOT:?run platformclaw-compose with a service user}/data/skillhub/storage:/var/lib/skillhub/storage
    networks:
      platformclaw-skillhub:
        aliases: [skillhub.platformclaw.local]
    # Compose file-backed secrets retain host ownership. Run the Java process as
    # the deployment UID so owner-only host secrets stay readable without
    # widening their host permissions.
    user: "${PLATFORMCLAW_RUNTIME_UID:?run platformclaw-compose with a service user}:${PLATFORMCLAW_RUNTIME_GID:?run platformclaw-compose with a service user}"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    entrypoint:
      - sh
      - -ceu
      - |
        read_secret() {
          value="$$(cat "$$2")" || {
            echo "Cannot read required SkillHub secret: $$1" >&2
            exit 1
          }
          [ -n "$$value" ] || {
            echo "Required SkillHub secret is empty: $$1" >&2
            exit 1
          }
          printf '%s' "$$value"
        }
        export SPRING_DATASOURCE_PASSWORD="$$(read_secret postgres-password /run/secrets/platformclaw_skill_hub_postgres_password)"
        export SKILLHUB_DOWNLOAD_ANON_COOKIE_SECRET="$$(read_secret cookie-secret /run/secrets/platformclaw_skill_hub_cookie_secret)"
        export BOOTSTRAP_ADMIN_PASSWORD="$$(read_secret bootstrap-password /run/secrets/platformclaw_skill_hub_bootstrap_password)"
        exec java -XX:MaxRAMPercentage=75.0 -jar app.jar
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  platformclaw-workspace-migration:
    image: ${PLATFORMCLAW_IMAGE:-platformclaw:local}
    pull_policy: never
    profiles: [migration]
    user: "0:0"
    environment:
      PLATFORMCLAW_RUNTIME_UID: ${PLATFORMCLAW_RUNTIME_UID:?run platformclaw-compose with a service user}
      PLATFORMCLAW_RUNTIME_GID: ${PLATFORMCLAW_RUNTIME_GID:?run platformclaw-compose with a service user}
    network_mode: none
    volumes:
      - platformclaw-workspaces:/source:ro
      - ${PLATFORMCLAW_DEPLOY_HOST_ROOT:?run platformclaw-compose with a service user}/data/workspaces:/target
    entrypoint: ["platformclaw-migrate-workspaces"]
    restart: "no"

  platformclaw-workspace-owner-migration:
    image: ${PLATFORMCLAW_IMAGE:-platformclaw:local}
    pull_policy: never
    profiles: [owner-migration]
    user: "0:0"
    environment:
      PLATFORMCLAW_RUNTIME_UID: ${PLATFORMCLAW_RUNTIME_UID:?run platformclaw-compose with a service user}
      PLATFORMCLAW_RUNTIME_GID: ${PLATFORMCLAW_RUNTIME_GID:?run platformclaw-compose with a service user}
      PLATFORMCLAW_PREVIOUS_RUNTIME_UID: ${PLATFORMCLAW_PREVIOUS_RUNTIME_UID:-}
      PLATFORMCLAW_PREVIOUS_RUNTIME_GID: ${PLATFORMCLAW_PREVIOUS_RUNTIME_GID:-}
    network_mode: none
    volumes:
      - ${PLATFORMCLAW_DEPLOY_HOST_ROOT:?run platformclaw-compose with a service user}/data/workspaces:/workspace
      - ./migrate-workspace-owner:/opt/platformclaw/migrate-workspace-owner:ro
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH]
    security_opt: [no-new-privileges:true]
    entrypoint: ["bash", "/opt/platformclaw/migrate-workspace-owner"]
    restart: "no"

volumes:
  platformclaw-workspaces:
  platformclaw-credential-broker:
    name: ${PLATFORMCLAW_CREDENTIAL_BROKER_VOLUME_NAME:?run platformclaw-compose with a service user}
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=${PLATFORMCLAW_RUNTIME_UID:?run platformclaw-compose with a service user},gid=${PLATFORMCLAW_RUNTIME_GID:?run platformclaw-compose with a service user},mode=0700

networks:
  platformclaw-gateway-backplane:
    internal: true
  platformclaw-gateway-egress:
  platformclaw-control-egress:
  platformclaw-skillhub:
    internal: true

secrets:
  platformclaw_gateway_token:
    file: ${PLATFORMCLAW_GATEWAY_TOKEN_SECRET_FILE:?set PLATFORMCLAW_GATEWAY_TOKEN_SECRET_FILE}
  platformclaw_gateway_service_identity:
    file: ${PLATFORMCLAW_GATEWAY_SERVICE_IDENTITY_SECRET_FILE:?set PLATFORMCLAW_GATEWAY_SERVICE_IDENTITY_SECRET_FILE}
  platformclaw_execution_service_token:
    file: ${PLATFORMCLAW_EXECUTION_SERVICE_TOKEN_SECRET_FILE:?set PLATFORMCLAW_EXECUTION_SERVICE_TOKEN_SECRET_FILE}
  platformclaw_initial_admin_ids:
    file: ${PLATFORMCLAW_INITIAL_ADMIN_IDS_SECRET_FILE:?set PLATFORMCLAW_INITIAL_ADMIN_IDS_SECRET_FILE}
  platformclaw_knox_webhook_secret:
    file: ${PLATFORMCLAW_KNOX_WEBHOOK_SECRET_SECRET_FILE:?set PLATFORMCLAW_KNOX_WEBHOOK_SECRET_SECRET_FILE}
  platformclaw_knox_service_token:
    file: ${PLATFORMCLAW_KNOX_SERVICE_TOKEN_SECRET_FILE:?set PLATFORMCLAW_KNOX_SERVICE_TOKEN_SECRET_FILE}
  platformclaw_ssh_credential_master_key:
    file: ${PLATFORMCLAW_SSH_CREDENTIAL_MASTER_KEY_SECRET_FILE:?set PLATFORMCLAW_SSH_CREDENTIAL_MASTER_KEY_SECRET_FILE}
  platformclaw_skill_hub_token:
    file: ${PLATFORMCLAW_DEPLOY_HOST_ROOT:?set PLATFORMCLAW_DEPLOY_HOST_ROOT}/secrets/skillhub-token
  platformclaw_skill_hub_postgres_password:
    file: ${PLATFORMCLAW_DEPLOY_HOST_ROOT:?set PLATFORMCLAW_DEPLOY_HOST_ROOT}/secrets/skillhub-postgres-password
  platformclaw_skill_hub_cookie_secret:
    file: ${PLATFORMCLAW_DEPLOY_HOST_ROOT:?set PLATFORMCLAW_DEPLOY_HOST_ROOT}/secrets/skillhub-cookie-secret
  platformclaw_skill_hub_bootstrap_password:
    file: ${PLATFORMCLAW_DEPLOY_HOST_ROOT:?set PLATFORMCLAW_DEPLOY_HOST_ROOT}/secrets/skillhub-bootstrap-password
  platformclaw_employee_auth_adsso_secret:
    file: ${PLATFORMCLAW_EMPLOYEE_AUTH_ADSSO_SECRET_SECRET_FILE:?set PLATFORMCLAW_EMPLOYEE_AUTH_ADSSO_SECRET_SECRET_FILE}
