services:
  sandbox-docker:
    image: docker.io/library/docker:27.5.1-dind-rootless@sha256:e2ac8e8f66ae21a060b0a8e3005c70f6ed9441aabf409434463d1f6eecd38026
    privileged: true
    environment:
      DOCKER_HOST: unix:///run/user/1000/docker.sock
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - ${PLATFORMCLAW_SMOKE_DOCKER_RUNTIME_DIR:?set PLATFORMCLAW_SMOKE_DOCKER_RUNTIME_DIR}:/run/user/1000
      - ${PLATFORMCLAW_SMOKE_DOCKER_DATA_DIR:?set PLATFORMCLAW_SMOKE_DOCKER_DATA_DIR}:/home/rootless/.local/share/docker
      - ${PLATFORMCLAW_SMOKE_WORKSPACE_DIR:?set PLATFORMCLAW_SMOKE_WORKSPACE_DIR}:/var/lib/platformclaw/workspaces
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 5s

  sandbox-image-loader:
    image: ${PLATFORMCLAW_IMAGE:-platformclaw:local}
    user: "1000:1000"
    entrypoint: ["bash", "-ceu"]
    depends_on:
      sandbox-docker:
        condition: service_healthy
    environment:
      DOCKER_HOST: unix:///run/platformclaw-sandbox-docker/docker.sock
      PLATFORMCLAW_SANDBOX_IMAGE: ${PLATFORMCLAW_SANDBOX_IMAGE:-platformclaw-sandbox:local}
    volumes:
      - ${PLATFORMCLAW_SMOKE_DOCKER_RUNTIME_DIR:?set PLATFORMCLAW_SMOKE_DOCKER_RUNTIME_DIR}:/run/platformclaw-sandbox-docker:ro
      - ${PLATFORMCLAW_SMOKE_SANDBOX_IMAGE_TAR:?set PLATFORMCLAW_SMOKE_SANDBOX_IMAGE_TAR}:/smoke/platformclaw-sandbox.tar:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command:
      - |
        docker load --input /smoke/platformclaw-sandbox.tar
        docker image inspect "$${PLATFORMCLAW_SANDBOX_IMAGE}" >/dev/null

  openclaw-gateway:
    depends_on:
      sandbox-image-loader:
        condition: service_completed_successfully
    volumes:
      - ${PLATFORMCLAW_SMOKE_WORKSPACE_DIR:?set PLATFORMCLAW_SMOKE_WORKSPACE_DIR}:/var/lib/platformclaw/workspaces
      - ${PLATFORMCLAW_SMOKE_DOCKER_RUNTIME_DIR:?set PLATFORMCLAW_SMOKE_DOCKER_RUNTIME_DIR}:/run/platformclaw-sandbox-docker:ro

  employee-auth-mock:
    image: ${PLATFORMCLAW_IMAGE:-platformclaw:local}
    network_mode: service:platformclaw-control
    volumes:
      - ${PLATFORMCLAW_REPO_ROOT:?set PLATFORMCLAW_REPO_ROOT}/scripts/mock_employee_auth.py:/smoke/mock_employee_auth.py:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    command: ["python3", "/smoke/mock_employee_auth.py", "--bind", "127.0.0.1", "--port", "18080"]
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18080/healthz', timeout=2)",
        ]
      interval: 2s
      timeout: 3s
      retries: 20

  platformclaw-control:
    environment:
      PLATFORMCLAW_EMPLOYEE_AUTH_LOGIN_URL: http://127.0.0.1:18080/login
    volumes:
      - ${PLATFORMCLAW_SMOKE_WORKSPACE_DIR:?set PLATFORMCLAW_SMOKE_WORKSPACE_DIR}:/var/lib/platformclaw/workspaces
