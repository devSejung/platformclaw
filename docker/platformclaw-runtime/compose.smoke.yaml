services:
  platformclaw-state-init:
    volumes:
      - platformclaw-smoke-gateway-state:/state/gateway
      - platformclaw-smoke-control-state:/state/control

  # Named volumes start root-owned. Hand them to the rootless daemon before it
  # starts so RootlessKit can secure both its runtime and persistent data paths.
  sandbox-docker-init:
    image: docker.io/library/docker:27.5.1-dind-rootless@sha256:e2ac8e8f66ae21a060b0a8e3005c70f6ed9441aabf409434463d1f6eecd38026
    user: "0:0"
    entrypoint: ["/bin/sh", "-ceu"]
    command: ["chown -R 1000:1000 /run/user/1000 /home/rootless/.local/share/docker"]
    network_mode: none
    volumes:
      - platformclaw-smoke-docker-run:/run/user/1000
      - platformclaw-smoke-docker-data:/home/rootless/.local/share/docker
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]

  sandbox-docker:
    image: docker.io/library/docker:27.5.1-dind-rootless@sha256:e2ac8e8f66ae21a060b0a8e3005c70f6ed9441aabf409434463d1f6eecd38026
    privileged: true
    depends_on:
      sandbox-docker-init:
        condition: service_completed_successfully
    environment:
      DOCKER_HOST: unix:///run/user/1000/docker.sock
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - platformclaw-smoke-docker-run:/run/user/1000
      - platformclaw-smoke-docker-data:/home/rootless/.local/share/docker
      - platformclaw-smoke-gateway-state:${PLATFORMCLAW_DEPLOY_ROOT:?set PLATFORMCLAW_DEPLOY_ROOT}/data/gateway-home/.openclaw:ro
      - ${PLATFORMCLAW_SMOKE_WORKSPACE_DIR:?set PLATFORMCLAW_SMOKE_WORKSPACE_DIR}:${PLATFORMCLAW_DEPLOY_ROOT:?set PLATFORMCLAW_DEPLOY_ROOT}/data/workspaces
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 5s

  sandbox-image-loader:
    image: ${PLATFORMCLAW_IMAGE:-platformclaw:local}
    user: "1000:1000"
    entrypoint: ["bash", "-ceu"]
    depends_on:
      sandbox-docker:
        condition: service_healthy
    environment:
      DOCKER_HOST: unix:///run/platformclaw-sandbox-docker/docker.sock
      PLATFORMCLAW_SANDBOX_IMAGE: ${PLATFORMCLAW_SANDBOX_IMAGE:-platformclaw-sandbox:local}
    volumes:
      - platformclaw-smoke-docker-run:/run/platformclaw-sandbox-docker:ro
      - ${PLATFORMCLAW_SMOKE_SANDBOX_IMAGE_TAR:?set PLATFORMCLAW_SMOKE_SANDBOX_IMAGE_TAR}:/smoke/platformclaw-sandbox.tar:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command:
      - |
        docker load --input /smoke/platformclaw-sandbox.tar
        docker image inspect "$${PLATFORMCLAW_SANDBOX_IMAGE}" >/dev/null

  openclaw-gateway:
    depends_on:
      sandbox-image-loader:
        condition: service_completed_successfully
      fake-safeconnect:
        condition: service_healthy
    volumes:
      - platformclaw-smoke-gateway-state:${PLATFORMCLAW_DEPLOY_ROOT:?set PLATFORMCLAW_DEPLOY_ROOT}/data/gateway-home/.openclaw
      - ${PLATFORMCLAW_SMOKE_WORKSPACE_DIR:?set PLATFORMCLAW_SMOKE_WORKSPACE_DIR}:${PLATFORMCLAW_DEPLOY_ROOT:?set PLATFORMCLAW_DEPLOY_ROOT}/data/workspaces
      - platformclaw-smoke-docker-run:/run/platformclaw-sandbox-docker:ro

  fake-safeconnect:
    build:
      context: ${PLATFORMCLAW_REPO_ROOT:?set PLATFORMCLAW_REPO_ROOT}
      dockerfile: scripts/e2e/lib/platformclaw-fake-safeconnect/Dockerfile
    user: "0:0"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - platformclaw-smoke-safeconnect-state:/state
      - platformclaw-smoke-safeconnect-users:/users
      - platformclaw-smoke-safeconnect-appdata:/appdata
    networks:
      platformclaw-gateway-egress:
        aliases: [safeconnect.platformclaw.test]
    cap_drop: [ALL]
    cap_add: [SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    init: true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; socket.create_connection(('127.0.0.1', 44422), 2).close()",
        ]
      interval: 2s
      timeout: 3s
      retries: 20

  employee-auth-mock:
    image: ${PLATFORMCLAW_IMAGE:-platformclaw:local}
    network_mode: service:platformclaw-control
    volumes:
      - ${PLATFORMCLAW_REPO_ROOT:?set PLATFORMCLAW_REPO_ROOT}/scripts/mock_employee_auth.py:/smoke/mock_employee_auth.py:ro
    secrets:
      - platformclaw_employee_auth_adsso_secret
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    command:
      [
        "python3",
        "/smoke/mock_employee_auth.py",
        "--bind",
        "127.0.0.1",
        "--port",
        "18080",
        "--adsso-secret-file",
        "/run/secrets/platformclaw_employee_auth_adsso_secret",
        "--platformclaw-origin",
        "${PLATFORMCLAW_PUBLIC_ORIGIN:?set PLATFORMCLAW_PUBLIC_ORIGIN}",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18080/healthz', timeout=2)",
        ]
      interval: 2s
      timeout: 3s
      retries: 20

  platformclaw-control:
    environment:
      PLATFORMCLAW_EMPLOYEE_AUTH_LOGIN_URL: http://127.0.0.1:18080/login
      PLATFORMCLAW_EMPLOYEE_AUTH_ADSSO_URL: http://127.0.0.1:18080/adsso
    volumes:
      - platformclaw-smoke-control-state:${PLATFORMCLAW_DEPLOY_ROOT:?set PLATFORMCLAW_DEPLOY_ROOT}/data/control
      - ${PLATFORMCLAW_SMOKE_WORKSPACE_DIR:?set PLATFORMCLAW_SMOKE_WORKSPACE_DIR}:${PLATFORMCLAW_DEPLOY_ROOT:?set PLATFORMCLAW_DEPLOY_ROOT}/data/workspaces

volumes:
  platformclaw-smoke-gateway-state:
  platformclaw-smoke-control-state:
  platformclaw-smoke-docker-run:
  platformclaw-smoke-docker-data:
  platformclaw-smoke-safeconnect-state:
  platformclaw-smoke-safeconnect-users:
  platformclaw-smoke-safeconnect-appdata:
